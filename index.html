<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>С Днём Рождения, малыш!</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #fafcff;
            color: #111827;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        .particles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        .particle {
            position: absolute;
            animation: fall linear infinite;
            pointer-events: none;
            opacity: 0.8;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) rotate(0deg) scale(1);
                opacity: 0;
            }
            5% {
                opacity: 0.85;
            }
            80% {
                opacity: 0.5;
            }
            100% {
                transform: translateY(105vh) rotate(360deg) scale(0.2);
                opacity: 0;
            }
        }

        .card {
            background: white;
            border-radius: 2rem;
            padding: 50px 40px 40px;
            text-align: center;
            max-width: 650px;
            width: 100%;
            position: relative;
            z-index: 1;
            box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            border: 2px solid #e2e8f0;
            transition: border-color 0.3s ease;
        }

        .card.rainbow-border {
            border: 2px solid transparent;
            background-clip: padding-box;
        }

        .card.rainbow-border::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 2rem;
            z-index: -1;
            background: conic-gradient(
                #ef4444, #f59e0b, #eab308, #22c55e, #3b82f6, #8b5cf6, #ef4444
            );
            -webkit-mask: 
                linear-gradient(#fff 0 0) content-box, 
                linear-gradient(#fff 0 0);
            mask: 
                linear-gradient(#fff 0 0) content-box, 
                linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            padding: 2px;
        }

        .settings-toggle {
            position: absolute;
            top: 20px;
            right: 24px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            transition: all 0.2s;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .settings-toggle:hover {
            background: rgba(255, 255, 255, 0.9);
        }

        .settings-toggle:focus {
            outline: none;
        }

        .settings-icon {
            font-size: 1.1rem;
            color: #6b7280;
            transition: transform 0.3s ease;
            line-height: 1;
        }

        .settings-toggle.open .settings-icon {
            transform: rotate(90deg);
        }

        .settings-dropdown {
            position: absolute;
            top: 64px;
            right: 16px;
            width: 280px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease, padding 0.35s ease, opacity 0.25s ease;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 1.25rem;
            border: 1px solid rgba(226, 232, 240, 0.5);
            z-index: 20;
            padding: 0 18px;
            opacity: 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .settings-dropdown.open {
            max-height: 440px;
            padding: 18px;
            opacity: 1;
        }

        .settings-dropdown label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            color: #6b7280;
            margin-bottom: 4px;
            text-align: left;
        }

        .settings-dropdown input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 0.75rem;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            color: #1e1b4b;
            background: rgba(249, 250, 251, 0.8);
            outline: none;
            letter-spacing: 1px;
            text-align: center;
            margin-bottom: 12px;
            transition: border 0.2s;
        }

        .settings-dropdown input:focus {
            border-color: #4f46e5;
            background: white;
            outline: none;
        }

        .settings-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
        }

        .settings-row + .settings-row {
            border-top: 1px solid rgba(226, 232, 240, 0.5);
        }

        .settings-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #374151;
            flex-shrink: 0;
            margin-right: 8px;
        }

        .color-options {
            display: flex;
            gap: 8px;
        }

        .color-dot {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .color-dot:focus {
            outline: none;
        }

        .color-dot:hover {
            transform: scale(1.15);
        }

        .color-dot.active {
            border-color: #374151;
            box-shadow: 0 0 0 2px rgba(255,255,255,0.8), 0 0 0 4px #374151;
        }

        .color-dot.blue {
            background: linear-gradient(180deg, #0f172a 0%, #1e3a5f 50%, #1e40af 100%);
        }

        .color-dot.red {
            background: linear-gradient(180deg, #450a0a 0%, #991b1b 50%, #ef4444 100%);
        }

        .color-dot.green {
            background: linear-gradient(180deg, #052e16 0%, #166534 50%, #22c55e 100%);
        }

        /* Кнопки-пилюли для анимации */
        .animation-pills {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .anim-pill {
            padding: 6px 12px;
            border-radius: 1rem;
            font-size: 0.73rem;
            font-weight: 600;
            cursor: pointer;
            background: #f3f4f6;
            color: #6b7280;
            border: 1px solid #e5e7eb;
            transition: all 0.2s;
            white-space: nowrap;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .anim-pill:focus {
            outline: none;
        }

        .anim-pill:hover {
            background: #e5e7eb;
        }

        .anim-pill.active {
            background: #4f46e5;
            color: white;
            border-color: #4f46e5;
        }

        .anim-pill .pill-icon {
            font-size: 0.85rem;
        }

        .toggle-switch {
            position: relative;
            width: 44px;
            height: 24px;
            background: #d1d5db;
            border-radius: 24px;
            cursor: pointer;
            transition: background 0.3s;
            flex-shrink: 0;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .toggle-switch:focus {
            outline: none;
        }

        .toggle-switch.active {
            background: linear-gradient(135deg, #ef4444, #f59e0b, #22c55e, #3b82f6, #8b5cf6);
            background-size: 300% 100%;
            animation: gradientShift 2s linear infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            transition: transform 0.3s;
        }

        .toggle-switch.active::after {
            transform: translateX(20px);
        }

        .icon {
            font-size: 70px;
            margin-bottom: 10px;
            filter: drop-shadow(0 8px 15px rgba(0,0,0,0.08));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
            transition: all 0.3s ease;
        }

        .subtitle {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 40px;
            letter-spacing: 2px;
            transition: opacity 0.2s;
        }

        .theme-default h1,
        .theme-default .subtitle,
        .theme-default .age-number,
        .theme-default .detail-value,
        .theme-default .detail-label {
            background: linear-gradient(180deg, #0f172a 0%, #1e3a5f 50%, #1e40af 100%);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .theme-red h1,
        .theme-red .subtitle,
        .theme-red .age-number,
        .theme-red .detail-value,
        .theme-red .detail-label {
            background: linear-gradient(180deg, #450a0a 0%, #991b1b 50%, #ef4444 100%);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .theme-green h1,
        .theme-green .subtitle,
        .theme-green .age-number,
        .theme-green .detail-value,
        .theme-green .detail-label {
            background: linear-gradient(180deg, #052e16 0%, #166534 50%, #22c55e 100%);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        h1.rainbow,
        .subtitle.rainbow,
        .age-number.rainbow,
        .detail-value.rainbow,
        .detail-label.rainbow {
            animation: rainbowText 3s linear infinite;
            background: none;
            -webkit-background-clip: unset;
            background-clip: unset;
            color: #3b82f6;
        }

        @keyframes rainbowText {
            0% { color: #ef4444; }
            16% { color: #f59e0b; }
            33% { color: #eab308; }
            50% { color: #22c55e; }
            66% { color: #3b82f6; }
            83% { color: #8b5cf6; }
            100% { color: #ef4444; }
        }

        .age-display {
            display: inline-block;
            margin-bottom: 35px;
            min-width: 180px;
            max-width: 100%;
        }

        .age-number {
            display: block;
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1.0;
            font-size: clamp(3.5rem, 12vw, 6.5rem);
            transition: all 0.3s ease;
        }

        .age-label {
            display: block;
            font-size: 1.1rem;
            color: #6b7280;
            font-weight: 500;
            letter-spacing: 1px;
            margin-top: 2px;
            transition: all 0.3s ease;
        }

        .age-label.rainbow {
            animation: rainbowText 3s linear infinite;
        }

        .details-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .detail-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f9fafb;
            border-radius: 1rem;
            padding: 16px 25px;
            border: 1px solid #e2e8f0;
            transition: all 0.2s;
        }

        .detail-row:hover {
            background: #f3f4f6;
            border-color: #c7d2fe;
        }

        .detail-label {
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .detail-value {
            font-weight: 800;
            line-height: 1.2;
            font-size: clamp(1.2rem, 4vw, 1.8rem);
            word-break: break-all;
            text-align: right;
            margin-left: 15px;
            letter-spacing: -0.01em;
            transition: all 0.3s ease;
        }

        @media (max-width: 500px) {
            .card {
                padding: 30px 20px 30px;
                border-radius: 1.5rem;
            }
            .card.rainbow-border::before {
                border-radius: 1.5rem;
            }
            .settings-toggle {
                top: 14px;
                right: 16px;
                width: 34px;
                height: 34px;
            }
            .settings-dropdown {
                top: 54px;
                right: 8px;
                width: 260px;
                border-radius: 1rem;
            }
            h1 {
                font-size: 2.2rem;
            }
            .subtitle {
                font-size: 1.2rem;
            }
            .age-display {
                min-width: 140px;
            }
            .detail-row {
                padding: 14px 20px;
            }
            .detail-label {
                font-size: 0.85rem;
            }
            .detail-value {
                font-size: clamp(1rem, 3.5vw, 1.5rem);
            }
        }
    </style>
</head>
<body>

    <div class="particles-container" id="particlesContainer"></div>

    <div class="card theme-default" id="mainCard">
        <div class="settings-toggle" id="settingsToggle">
            <span class="settings-icon">⚙</span>
        </div>

        <div class="settings-dropdown" id="settingsDropdown">
            <label for="nameInput">Имя</label>
            <input type="text" id="nameInput" placeholder="Имя" maxlength="20">

            <label for="dateInput">Дата рождения</label>
            <input type="text" id="dateInput" placeholder="25.05.2026" maxlength="10">

            <div class="settings-row">
                <span class="settings-label">Цвет</span>
                <div class="color-options">
                    <div class="color-dot blue active" data-theme="default"></div>
                    <div class="color-dot red" data-theme="red"></div>
                    <div class="color-dot green" data-theme="green"></div>
                </div>
            </div>

            <div class="settings-row">
                <span class="settings-label">Анимация</span>
                <div class="animation-pills">
                    <button class="anim-pill active" data-anim="none">
                        <span class="pill-icon">⏸</span> Нет
                    </button>
                    <button class="anim-pill" data-anim="bears">
                        <span class="pill-icon">🧸</span> Мишки
                    </button>
                    <button class="anim-pill" data-anim="snowflakes">
                        <span class="pill-icon">❄️</span> Снег
                    </button>
                </div>
            </div>

            <div class="settings-row">
                <span class="settings-label">Светодиодный режим</span>
                <div class="toggle-switch" id="ledToggle"></div>
            </div>
        </div>

        <div class="icon">🧸</div>
        <h1 id="nameDisplay">Имя</h1>
        <p class="subtitle" id="dateDisplay">00.00.0000 г.</p>

        <div class="age-display">
            <span class="age-number" id="years">0</span>
            <span class="age-label" id="ageLabel">лет</span>
        </div>

        <div class="details-list">
            <div class="detail-row">
                <span class="detail-label" id="labelDays">Дней</span>
                <span class="detail-value" id="days">0</span>
            </div>
            <div class="detail-row">
                <span class="detail-label" id="labelHours">Часов</span>
                <span class="detail-value" id="hours">0</span>
            </div>
            <div class="detail-row">
                <span class="detail-label" id="labelMinutes">Минут</span>
                <span class="detail-value" id="minutes">0</span>
            </div>
            <div class="detail-row">
                <span class="detail-label" id="labelSeconds">Секунд</span>
                <span class="detail-value" id="seconds">0</span>
            </div>
        </div>
    </div>

    <script>
        let birthDate = new Date(2026, 5, 25, 14, 30, 0);
        let dateDisplayText = '00.00.0000';
        let displayName = 'Имя';
        let ledMode = false;
        let currentTheme = 'default';
        let currentAnimation = 'none';
        let particlesInterval = null;
        
        if (birthDate.getFullYear() > 2000) {
            const d = String(birthDate.getDate()).padStart(2, '0');
            const m = String(birthDate.getMonth() + 1).padStart(2, '0');
            const y = birthDate.getFullYear();
            dateDisplayText = `${d}.${m}.${y}`;
        }
        document.getElementById('dateDisplay').textContent = dateDisplayText + ' г.';
        document.getElementById('dateInput').value = dateDisplayText;
        document.getElementById('nameInput').value = displayName;

        function formatNumber(num) {
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '\u00A0');
        }

        function updateCounter() {
            const now = new Date();
            let diff = now - birthDate;

            if (diff < 0) {
                document.getElementById('years').textContent = '0.0';
                document.getElementById('days').textContent = '0';
                document.getElementById('hours').textContent = '0';
                document.getElementById('minutes').textContent = '0';
                document.getElementById('seconds').textContent = '0';
                return;
            }

            const msPerSecond = 1000;
            const msPerMinute = msPerSecond * 60;
            const msPerHour = msPerMinute * 60;
            const msPerDay = msPerHour * 24;
            const msPerYear = msPerDay * 365.25;

            const totalSeconds = Math.floor(diff / msPerSecond);
            const totalMinutes = Math.floor(diff / msPerMinute);
            const totalHours = Math.floor(diff / msPerHour);
            const totalDays = Math.floor(diff / msPerDay);
            const yearsFloat = diff / msPerYear;

            let yearsDisplay;
            if (yearsFloat >= 1000) {
                yearsDisplay = Math.round(yearsFloat).toString();
            } else {
                yearsDisplay = yearsFloat.toFixed(1);
            }

            document.getElementById('years').textContent = yearsDisplay;
            document.getElementById('days').textContent = formatNumber(totalDays);
            document.getElementById('hours').textContent = formatNumber(totalHours);
            document.getElementById('minutes').textContent = formatNumber(totalMinutes);
            document.getElementById('seconds').textContent = formatNumber(totalSeconds);
        }

        function applyLedMode() {
            const mainCard = document.getElementById('mainCard');
            const elements = [
                document.getElementById('nameDisplay'),
                document.getElementById('dateDisplay'),
                document.getElementById('years'),
                document.getElementById('ageLabel'),
                document.getElementById('days'),
                document.getElementById('hours'),
                document.getElementById('minutes'),
                document.getElementById('seconds'),
                document.getElementById('labelDays'),
                document.getElementById('labelHours'),
                document.getElementById('labelMinutes'),
                document.getElementById('labelSeconds'),
            ];

            if (ledMode) {
                mainCard.classList.add('rainbow-border');
                elements.forEach(el => el.classList.add('rainbow'));
            } else {
                mainCard.classList.remove('rainbow-border');
                elements.forEach(el => el.classList.remove('rainbow'));
            }
        }

        function applyTheme(theme) {
            const card = document.getElementById('mainCard');
            card.classList.remove('theme-default', 'theme-red', 'theme-green');
            card.classList.add('theme-' + theme);
            currentTheme = theme;
        }

        // Анимации
        const particlesContainer = document.getElementById('particlesContainer');
        const snowflakes = ['❄️', '❄️', '❄️', '❅', '❆', '❄️', '❄️'];

        function createParticle() {
            if (currentAnimation === 'none') return;
            
            const particle = document.createElement('span');
            particle.className = 'particle';
            
            if (currentAnimation === 'bears') {
                const bears = ['🧸', '🐻', '🐻‍❄️'];
                particle.textContent = bears[Math.floor(Math.random() * bears.length)];
                const size = 22 + Math.random() * 28;
                particle.style.fontSize = size + 'px';
            } else if (currentAnimation === 'snowflakes') {
                particle.textContent = snowflakes[Math.floor(Math.random() * snowflakes.length)];
                const size = 10 + Math.random() * 22;
                particle.style.fontSize = size + 'px';
            }
            
            particle.style.left = Math.random() * 95 + 'vw';
            particle.style.animationDuration = (5 + Math.random() * 8) + 's';
            
            particlesContainer.appendChild(particle);
            
            particle.addEventListener('animationend', () => {
                particle.remove();
            });
        }

        function startParticles() {
            stopParticles();
            if (currentAnimation === 'none') return;
            
            const interval = currentAnimation === 'bears' ? 1400 : 500;
            particlesInterval = setInterval(createParticle, interval);
            
            for (let i = 0; i < 6; i++) {
                setTimeout(() => createParticle(), i * 200);
            }
        }

        function stopParticles() {
            if (particlesInterval) {
                clearInterval(particlesInterval);
                particlesInterval = null;
            }
            particlesContainer.innerHTML = '';
        }

        // Кнопка и дропдаун
        const settingsToggle = document.getElementById('settingsToggle');
        const settingsDropdown = document.getElementById('settingsDropdown');

        settingsToggle.addEventListener('click', function(e) {
            e.stopPropagation();
            const isOpen = settingsDropdown.classList.contains('open');
            if (isOpen) {
                settingsDropdown.classList.remove('open');
                settingsToggle.classList.remove('open');
            } else {
                settingsDropdown.classList.add('open');
                settingsToggle.classList.add('open');
            }
        });

        document.addEventListener('click', function(e) {
            if (!settingsDropdown.contains(e.target) && e.target !== settingsToggle && !settingsToggle.contains(e.target)) {
                settingsDropdown.classList.remove('open');
                settingsToggle.classList.remove('open');
            }
        });

        // Светодиодный переключатель
        const ledToggle = document.getElementById('ledToggle');
        ledToggle.addEventListener('click', function() {
            ledMode = !ledMode;
            if (ledMode) {
                ledToggle.classList.add('active');
            } else {
                ledToggle.classList.remove('active');
            }
            applyLedMode();
        });

        // Цвета
        const colorDots = document.querySelectorAll('.color-dot');
        colorDots.forEach(dot => {
            dot.addEventListener('click', function() {
                colorDots.forEach(d => d.classList.remove('active'));
                this.classList.add('active');
                applyTheme(this.dataset.theme);
            });
        });

        // Анимации — кнопки-пилюли
        const animPills = document.querySelectorAll('.anim-pill');
        animPills.forEach(pill => {
            pill.addEventListener('click', function() {
                animPills.forEach(p => p.classList.remove('active'));
                this.classList.add('active');
                currentAnimation = this.dataset.anim;
                startParticles();
            });
        });

        // Сохранение при вводе
        const nameInput = document.getElementById('nameInput');
        const dateInputEl = document.getElementById('dateInput');

        nameInput.addEventListener('input', function() {
            const val = this.value.trim();
            if (val) {
                displayName = val;
                document.getElementById('nameDisplay').textContent = displayName;
                if (ledMode) document.getElementById('nameDisplay').classList.add('rainbow');
            }
        });

        dateInputEl.addEventListener('input', function() {
            const value = this.value.trim();
            const parts = value.split('.');
            if (parts.length === 3) {
                const day = parseInt(parts[0], 10);
                const month = parseInt(parts[1], 10) - 1;
                const year = parseInt(parts[2], 10);
                if (!isNaN(day) && !isNaN(month) && !isNaN(year) && day > 0 && day <= 31 && month >= 0 && month <= 11 && year >= 1900 && year <= 2100) {
                    birthDate = new Date(year, month, day, 14, 30, 0);
                    dateDisplayText = value;
                    document.getElementById('dateDisplay').textContent = dateDisplayText + ' г.';
                    if (ledMode) document.getElementById('dateDisplay').classList.add('rainbow');
                    updateCounter();
                }
            }
        });

        updateCounter();
        setInterval(updateCounter, 1000);
    </script>
</body>
