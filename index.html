<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>С Днём Рождения, малыш!</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #fafcff;
            color: #111827;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
            position: relative;
            overflow: hidden;
        }

        .particles-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 100;
        }

        .particle {
            position: absolute; pointer-events: none; opacity: 0;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.06));
            will-change: transform, opacity;
        }

        @keyframes fallLeft {
            0% { transform: translateY(-15vh) translateX(0) rotate(0deg); opacity: 0; }
            6% { opacity: 0.8; } 70% { opacity: 0.5; }
            100% { transform: translateY(108vh) translateX(-8vw) rotate(-180deg); opacity: 0; }
        }
        @keyframes fallRight {
            0% { transform: translateY(-15vh) translateX(0) rotate(0deg); opacity: 0; }
            6% { opacity: 0.8; } 70% { opacity: 0.5; }
            100% { transform: translateY(108vh) translateX(8vw) rotate(180deg); opacity: 0; }
        }
        @keyframes fallStraight {
            0% { transform: translateY(-15vh) translateX(0) rotate(0deg); opacity: 0; }
            6% { opacity: 0.8; } 70% { opacity: 0.5; }
            100% { transform: translateY(108vh) translateX(0) rotate(45deg); opacity: 0; }
        }
        @keyframes fallSway {
            0% { transform: translateY(-15vh) translateX(0) rotate(-10deg); opacity: 0; }
            6% { opacity: 0.8; }
            25% { transform: translateY(20vh) translateX(4vw) rotate(15deg); }
            50% { transform: translateY(50vh) translateX(-3vw) rotate(-5deg); opacity: 0.55; }
            75% { transform: translateY(75vh) translateX(2vw) rotate(10deg); }
            100% { transform: translateY(108vh) translateX(-1vw) rotate(-20deg); opacity: 0; }
        }
        @keyframes fallGentle {
            0% { transform: translateY(-15vh) translateX(0) rotate(0deg); opacity: 0; }
            6% { opacity: 0.7; }
            100% { transform: translateY(108vh) translateX(3vw) rotate(15deg); opacity: 0; }
        }

        .card {
            background: white; border-radius: 2rem; padding: 50px 40px 40px;
            text-align: center; max-width: 650px; width: 100%;
            position: relative; z-index: 1;
            box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            border: 2px solid #e2e8f0; transition: border-color 0.3s ease;
        }
        .card.rainbow-border { border: 2px solid transparent; background-clip: padding-box; }
        .card.rainbow-border::before {
            content: '';
            position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px;
            border-radius: 2rem; z-index: -1;
            background: conic-gradient(#ef4444,#f59e0b,#eab308,#22c55e,#3b82f6,#8b5cf6,#ef4444);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude; padding: 2px;
        }

        .settings-toggle {
            position: absolute; top: 20px; right: 24px; width: 38px; height: 38px;
            border-radius: 50%; background: rgba(255,255,255,0.7);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(226,232,240,0.6);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 10; transition: all 0.2s;
            user-select: none; -webkit-tap-highlight-color: transparent;
        }
        .settings-toggle:hover { background: rgba(255,255,255,0.9); }
        .settings-toggle:focus { outline: none; }
        .settings-icon { font-size: 1.1rem; color: #6b7280; transition: transform 0.3s ease; line-height: 1; }
        .settings-toggle.open .settings-icon { transform: rotate(90deg); }

        .settings-dropdown {
            position: absolute; top: 64px; right: 16px; width: 280px; max-height: 0;
            overflow: hidden; transition: max-height 0.35s ease, padding 0.35s ease, opacity 0.25s ease;
            background: rgba(255,255,255,0.75); backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px); border-radius: 1.25rem;
            border: 1px solid rgba(226,232,240,0.5); z-index: 20;
            padding: 0 18px; opacity: 0; box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        .settings-dropdown.open { max-height: 440px; padding: 18px; opacity: 1; }
        .settings-dropdown label {
            display: block; font-size: 0.78rem; font-weight: 600; color: #6b7280;
            margin-bottom: 4px; text-align: left;
        }
        .settings-dropdown input {
            width: 100%; padding: 10px 14px; border: 1px solid #e2e8f0;
            border-radius: 0.75rem; font-size: 0.95rem; font-family: 'Inter', sans-serif;
            font-weight: 500; color: #1e1b4b; background: rgba(249,250,251,0.8);
            outline: none; letter-spacing: 1px; text-align: center;
            margin-bottom: 12px; transition: border 0.2s;
        }
        .settings-dropdown input:focus { border-color: #4f46e5; background: white; outline: none; }

        .settings-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 0; flex-wrap: wrap; gap: 8px;
        }
        .settings-row + .settings-row { border-top: 1px solid rgba(226,232,240,0.5); }
        .settings-label { font-size: 0.85rem; font-weight: 600; color: #374151; flex-shrink: 0; }

        .color-options { display: flex; gap: 8px; }
        .color-dot {
            width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
            border: 2px solid transparent; transition: all 0.2s; outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        .color-dot:focus { outline: none; }
        .color-dot:hover { transform: scale(1.15); }
        .color-dot.active { border-color: #374151; box-shadow: 0 0 0 2px rgba(255,255,255,0.8), 0 0 0 4px #374151; }
        .color-dot.blue { background: linear-gradient(180deg,#0f172a 0%,#1e3a5f 50%,#1e40af 100%); }
        .color-dot.red { background: linear-gradient(180deg,#450a0a 0%,#991b1b 50%,#ef4444 100%); }
        .color-dot.green { background: linear-gradient(180deg,#052e16 0%,#166534 50%,#22c55e 100%); }

        .anim-options { display: flex; gap: 6px; }
        .anim-dot {
            width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
            border: 2px solid transparent; transition: all 0.2s; outline: none;
            -webkit-tap-highlight-color: transparent; background: #f3f4f6;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.9rem; line-height: 1;
        }
        .anim-dot:focus { outline: none; }
        .anim-dot:hover { transform: scale(1.15); background: #e5e7eb; }
        .anim-dot.active { border-color: #374151; box-shadow: 0 0 0 2px rgba(255,255,255,0.8), 0 0 0 4px #374151; background: #e5e7eb; }

        .toggle-switch {
            position: relative; width: 44px; height: 24px; background: #d1d5db;
            border-radius: 24px; cursor: pointer; transition: background 0.3s;
            flex-shrink: 0; outline: none; -webkit-tap-highlight-color: transparent;
        }
        .toggle-switch:focus { outline: none; }
        .toggle-switch.active {
            background: linear-gradient(135deg,#ef4444,#f59e0b,#22c55e,#3b82f6,#8b5cf6);
            background-size: 300% 100%; animation: gradientShift 2s linear infinite;
        }
        @keyframes gradientShift { 0% { background-position: 0% 50%; } 100% { background-position: 300% 50%; } }
        .toggle-switch::after {
            content: ''; position: absolute; top: 2px; left: 2px;
            width: 20px; height: 20px; background: white; border-radius: 50%;
            transition: transform 0.3s;
        }
        .toggle-switch.active::after { transform: translateX(20px); }

        .icon {
            font-size: 70px; margin-bottom: 10px;
            filter: drop-shadow(0 8px 15px rgba(0,0,0,0.08));
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        h1 { font-size: 2.8rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 8px; transition: all 0.3s ease; }
        .subtitle { font-size: 1.5rem; font-weight: 700; margin-bottom: 40px; letter-spacing: 2px; transition: opacity 0.2s; }

        /* Темы */
        .theme-default h1, .theme-default .subtitle,
        .theme-default .age-number, .theme-default .detail-value, .theme-default .detail-label {
            background: linear-gradient(180deg,#0f172a 0%,#1e3a5f 50%,#1e40af 100%);
            background-clip: text; -webkit-background-clip: text; color: transparent;
        }
        .theme-red h1, .theme-red .subtitle,
        .theme-red .age-number, .theme-red .detail-value, .theme-red .detail-label {
            background: linear-gradient(180deg,#450a0a 0%,#991b1b 50%,#ef4444 100%);
            background-clip: text; -webkit-background-clip: text; color: transparent;
        }
        .theme-green h1, .theme-green .subtitle,
        .theme-green .age-number, .theme-green .detail-value, .theme-green .detail-label {
            background: linear-gradient(180deg,#052e16 0%,#166534 50%,#22c55e 100%);
            background-clip: text; -webkit-background-clip: text; color: transparent;
        }

        h1.rainbow, .subtitle.rainbow, .age-number.rainbow,
        .detail-value.rainbow, .detail-label.rainbow {
            animation: rainbowText 3s linear infinite;
            background: none; -webkit-background-clip: unset; background-clip: unset; color: #3b82f6;
        }
        @keyframes rainbowText {
            0% { color: #ef4444; } 16% { color: #f59e0b; } 33% { color: #eab308; }
            50% { color: #22c55e; } 66% { color: #3b82f6; } 83% { color: #8b5cf6; } 100% { color: #ef4444; }
        }

        .age-display { display: inline-block; margin-bottom: 35px; min-width: 180px; max-width: 100%; }
        .age-number { display: block; font-weight: 800; letter-spacing: -0.02em; line-height: 1.0; font-size: clamp(3.5rem,12vw,6.5rem); transition: all 0.3s ease; }
        .age-label { display: block; font-size: 1.1rem; color: #6b7280; font-weight: 500; letter-spacing: 1px; margin-top: 2px; transition: all 0.3s ease; }
        .age-label.rainbow { animation: rainbowText 3s linear infinite; }

        .details-list { display: flex; flex-direction: column; gap: 10px; }
        .detail-row {
            display: flex; align-items: center; justify-content: space-between;
            background: #f9fafb; border-radius: 1rem; padding: 16px 25px;
            border: 1px solid #e2e8f0; transition: all 0.2s;
        }
        .detail-row:hover { background: #f3f4f6; border-color: #c7d2fe; }
        .detail-label { font-size: 0.95rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; flex-shrink: 0; transition: all 0.3s ease; }
        .detail-value { font-weight: 800; line-height: 1.2; font-size: clamp(1.2rem,4vw,1.8rem); word-break: break-all; text-align: right; margin-left: 15px; letter-spacing: -0.01em; transition: all 0.3s ease; }

        @media (max-width: 500px) {
            .card { padding: 30px 20px 30px; border-radius: 1.5rem; }
            .card.rainbow-border::before { border-radius: 1.5rem; }
            .settings-toggle { top: 14px; right: 16px; width: 34px; height: 34px; }
            .settings-dropdown { top: 54px; right: 8px; width: 260px; border-radius: 1rem; }
            h1 { font-size: 2.2rem; }
            .subtitle { font-size: 1.2rem; }
            .age-display { min-width: 140px; }
            .detail-row { padding: 14px 20px; }
            .detail-label { font-size: 0.85rem; }
            .detail-value { font-size: clamp(1rem,3.5vw,1.5rem); }
        }
    </style>
</head>
<body>

    <div class="particles-container" id="particlesContainer"></div>

    <div class="card theme-default" id="mainCard">
        <div class="settings-toggle" id="settingsToggle">
            <span class="settings-icon">⚙</span>
        </div>
        <div class="settings-dropdown" id="settingsDropdown">
            <label for="nameInput">Имя</label>
            <input type="text" id="nameInput" placeholder="Имя" maxlength="20">
            <label for="dateInput">Дата рождения</label>
            <input type="text" id="dateInput" placeholder="25.05.2026" maxlength="10">
            <div class="settings-row">
                <span class="settings-label">Цвет</span>
                <div class="color-options">
                    <div class="color-dot blue active" data-theme="default"></div>
                    <div class="color-dot red" data-theme="red"></div>
                    <div class="color-dot green" data-theme="green"></div>
                </div>
            </div>
            <div class="settings-row">
                <span class="settings-label">Анимации</span>
                <div class="anim-options">
                    <button class="anim-dot active" data-anim="none" title="Выкл">✕</button>
                    <button class="anim-dot" data-anim="animals" title="Зверята">🐾</button>
                    <button class="anim-dot" data-anim="leaves" title="Листья">🍁</button>
                    <button class="anim-dot" data-anim="snowflakes" title="Снежинки">❄️</button>
                </div>
            </div>
            <div class="settings-row">
                <span class="settings-label">Светодиодный режим</span>
                <div class="toggle-switch" id="ledToggle"></div>
            </div>
        </div>

        <div class="icon">🧸</div>
        <h1 id="nameDisplay">Имя</h1>
        <p class="subtitle" id="dateDisplay">00.00.0000 г.</p>

        <div class="age-display">
            <span class="age-number" id="years">0</span>
            <span class="age-label" id="ageLabel">лет</span>
        </div>

        <div class="details-list">
            <div class="detail-row"><span class="detail-label" id="labelDays">Дней</span><span class="detail-value" id="days">0</span></div>
            <div class="detail-row"><span class="detail-label" id="labelHours">Часов</span><span class="detail-value" id="hours">0</span></div>
            <div class="detail-row"><span class="detail-label" id="labelMinutes">Минут</span><span class="detail-value" id="minutes">0</span></div>
            <div class="detail-row"><span class="detail-label" id="labelSeconds">Секунд</span><span class="detail-value" id="seconds">0</span></div>
        </div>
    </div>

    <script>
        // === ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ (определяются ДО использования) ===
        function formatNumber(num) {
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '\u00A0');
        }

        function updateCounter() {
            const now = new Date();
            let diff = now - birthDate;
            if (diff < 0) {
                document.getElementById('years').textContent = '0.0';
                document.getElementById('days').textContent = '0';
                document.getElementById('hours').textContent = '0';
                document.getElementById('minutes').textContent = '0';
                document.getElementById('seconds').textContent = '0';
                return;
            }
            const ms = 1000;
            const totalSeconds = Math.floor(diff / ms);
            const totalMinutes = Math.floor(diff / (ms * 60));
            const totalHours = Math.floor(diff / (ms * 60 * 60));
            const totalDays = Math.floor(diff / (ms * 60 * 60 * 24));
            const yearsFloat = diff / (ms * 60 * 60 * 24 * 365.25);
            let yearsDisplay = yearsFloat >= 1000 ? Math.round(yearsFloat) : yearsFloat.toFixed(1);
            document.getElementById('years').textContent = yearsDisplay;
            document.getElementById('days').textContent = formatNumber(totalDays);
            document.getElementById('hours').textContent = formatNumber(totalHours);
            document.getElementById('minutes').textContent = formatNumber(totalMinutes);
            document.getElementById('seconds').textContent = formatNumber(totalSeconds);
        }

        function applyLedMode() {
            const card = document.getElementById('mainCard');
            card.classList.toggle('rainbow-border', ledMode);
            ['nameDisplay','dateDisplay','years','ageLabel',
             'days','hours','minutes','seconds',
             'labelDays','labelHours','labelMinutes','labelSeconds']
                .map(id => document.getElementById(id))
                .forEach(el => el.classList.toggle('rainbow', ledMode));
        }

        function applyTheme(theme) {
            document.getElementById('mainCard').classList.remove('theme-default','theme-red','theme-green');
            document.getElementById('mainCard').classList.add('theme-' + theme);
            currentTheme = theme;
            saveSetting('theme', theme);
        }

        // Анимации
        let spawnTimeout = null;
        const particlesContainer = document.getElementById('particlesContainer');
        const sets = {
            animals: ['🐻','🧸','🦊','🐰','🐱','🐶','🐼','🐨'],
            leaves: ['🍁','🍂','🍃','🌿','🍀'],
            snowflakes: ['❄️','❄️','❄️','❅','❆','❄️','❄️'],
        };
        const animNames = ['fallLeft','fallRight','fallStraight','fallSway','fallGentle'];

        function createParticle() {
            if (currentAnimation === 'none') return;
            const p = document.createElement('span');
            p.className = 'particle';
            const set = sets[currentAnimation] || [];
            p.textContent = set[Math.floor(Math.random() * set.length)];
            let size = currentAnimation === 'animals' ? 34 + Math.random()*30 :
                       currentAnimation === 'leaves' ? 22 + Math.random()*26 : 14 + Math.random()*22;
            p.style.fontSize = size + 'px';
            p.style.left = Math.random()*90 + 'vw';
            p.style.animationName = animNames[Math.floor(Math.random()*animNames.length)];
            let duration = currentAnimation === 'leaves' ? 10+Math.random()*8 :
                           currentAnimation === 'snowflakes' ? 8+Math.random()*10 : 8+Math.random()*8;
            p.style.animationDuration = duration + 's';
            p.style.animationDelay = Math.random()*2 + 's';
            p.style.animationTimingFunction = 'linear';
            p.style.animationIterationCount = '1';
            p.style.animationFillMode = 'forwards';
            particlesContainer.appendChild(p);
            setTimeout(() => { if (p.parentNode) p.remove(); }, (duration+2)*1000+100);
        }

        function scheduleParticle() {
            if (currentAnimation === 'none') return;
            let interval = currentAnimation === 'leaves' ? 1000+Math.random()*1500 :
                           currentAnimation === 'snowflakes' ? 500+Math.random()*800 : 1600+Math.random()*2000;
            spawnTimeout = setTimeout(() => { createParticle(); scheduleParticle(); }, interval);
        }

        function startParticles() {
            stopParticles();
            if (currentAnimation === 'none') return;
            let count = currentAnimation === 'leaves' ? 10 :
                        currentAnimation === 'snowflakes' ? 14 : 6;
            for (let i=0; i<count; i++) setTimeout(() => createParticle(), i*250);
            setTimeout(() => scheduleParticle(), count*250+400);
        }

        function stopParticles() {
            if (spawnTimeout) { clearTimeout(spawnTimeout); spawnTimeout = null; }
            particlesContainer.innerHTML = '';
        }

        // === LOCAL STORAGE ===
        function loadSetting(key, fallback) {
            try { const v = localStorage.getItem('baby_timer_' + key); return v !== null ? v : fallback; }
            catch(e) { return fallback; }
        }
        function saveSetting(key, value) {
            try { localStorage.setItem('baby_timer_' + key, value); } catch(e) {}
        }

        // === ЗАГРУЗКА НАСТРОЕК ===
        let displayName = loadSetting('name', 'Имя');
        let dateDisplayText = loadSetting('dateDisplay', '00.00.0000');
        let currentTheme = loadSetting('theme', 'default');
        let ledMode = loadSetting('ledMode', 'false') === 'true';
        let currentAnimation = loadSetting('animation', 'none');

        const savedDate = loadSetting('birthDate', '2026-06-25T14:30:00');
        let birthDate = new Date(savedDate);
        if (isNaN(birthDate.getTime())) birthDate = new Date(2026, 5, 25, 14, 30, 0);
        if (birthDate.getFullYear() > 2000 && dateDisplayText === '00.00.0000') {
            dateDisplayText = String(birthDate.getDate()).padStart(2,'0') + '.' +
                              String(birthDate.getMonth()+1).padStart(2,'0') + '.' +
                              birthDate.getFullYear();
            saveSetting('dateDisplay', dateDisplayText);
        }

        // Применяем к DOM
        document.getElementById('nameDisplay').textContent = displayName;
        document.getElementById('dateDisplay').textContent = dateDisplayText + ' г.';
        document.getElementById('nameInput').value = displayName;
        document.getElementById('dateInput').value = dateDisplayText;
        document.getElementById('mainCard').classList.add('theme-' + currentTheme);
        document.querySelectorAll('.color-dot').forEach(d => d.classList.toggle('active', d.dataset.theme === currentTheme));
        document.querySelectorAll('.anim-dot').forEach(d => d.classList.toggle('active', d.dataset.anim === currentAnimation));
        if (ledMode) { document.getElementById('ledToggle').classList.add('active'); applyLedMode(); }
        if (currentAnimation !== 'none') startParticles();

        // === НАСТРОЙКИ UI ===
        const settingsToggle = document.getElementById('settingsToggle');
        const settingsDropdown = document.getElementById('settingsDropdown');
        settingsToggle.addEventListener('click', e => {
            e.stopPropagation();
            settingsDropdown.classList.toggle('open');
            settingsToggle.classList.toggle('open');
        });
        document.addEventListener('click', e => {
            if (!settingsDropdown.contains(e.target) && e.target !== settingsToggle && !settingsToggle.contains(e.target)) {
                settingsDropdown.classList.remove('open');
                settingsToggle.classList.remove('open');
            }
        });

        document.getElementById('ledToggle').addEventListener('click', () => {
            ledMode = !ledMode;
            document.getElementById('ledToggle').classList.toggle('active', ledMode);
            saveSetting('ledMode', ledMode);
            applyLedMode();
        });

        document.querySelectorAll('.color-dot').forEach(dot => {
            dot.addEventListener('click', function() {
                document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
                this.classList.add('active');
                applyTheme(this.dataset.theme);
            });
        });

        document.querySelectorAll('.anim-dot').forEach(dot => {
            dot.addEventListener('click', function() {
                document.querySelectorAll('.anim-dot').forEach(d => d.classList.remove('active'));
                this.classList.add('active');
                currentAnimation = this.dataset.anim;
                saveSetting('animation', currentAnimation);
                startParticles();
            });
        });

        document.getElementById('nameInput').addEventListener('input', function() {
            const val = this.value.trim();
            if (val) {
                displayName = val;
                document.getElementById('nameDisplay').textContent = displayName;
                if (ledMode) document.getElementById('nameDisplay').classList.add('rainbow');
                saveSetting('name', displayName);
            }
        });

        document.getElementById('dateInput').addEventListener('input', function() {
            const value = this.value.trim();
            const parts = value.split('.');
            if (parts.length === 3) {
                const d = parseInt(parts[0]), m = parseInt(parts[1])-1, y = parseInt(parts[2]);
                if (!isNaN(d) && !isNaN(m) && !isNaN(y) && d>0 && d<=31 && m>=0 && m<=11 && y>=1900 && y<=2100) {
                    birthDate = new Date(y, m, d, 14, 30, 0);
                    dateDisplayText = value;
                    document.getElementById('dateDisplay').textContent = dateDisplayText + ' г.';
                    if (ledMode) document.getElementById('dateDisplay').classList.add('rainbow');
                    saveSetting('birthDate', birthDate.toISOString());
                    saveSetting('dateDisplay', dateDisplayText);
                    updateCounter();
                }
            }
        });

        updateCounter();
        setInterval(updateCounter, 1000);
    </script>
